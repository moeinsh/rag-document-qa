<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuChat — Chat with your PDFs</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #334155; }
  header h1 { margin:0; font-size:18px; }
  header h1 span { color:var(--accent); }
  header p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;
          max-width:860px; width:100%; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:12px; line-height:1.55; white-space:pre-wrap; max-width:100%; }
  .user { background:#0369a1; align-self:flex-end; }
  .bot { background:var(--panel); border:1px solid #334155; align-self:flex-start; width:100%; }
  .src { margin-top:10px; font-size:12px; color:var(--muted); border-top:1px dashed #334155; padding-top:8px; }
  .src b { color:var(--accent); }
  #bar { display:flex; gap:10px; padding:14px 20px; background:var(--panel);
         border-top:1px solid #334155; max-width:900px; width:100%; margin:0 auto; }
  #q { flex:1; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1220;
       color:var(--text); font-size:15px; }
  button { padding:12px 22px; border-radius:10px; border:0; background:var(--accent);
           color:#082f49; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .hint { text-align:center; color:var(--muted); font-size:13px; padding:8px 20px; }
</style>
</head>
<body>
<header>
  <h1>Docu<span>Chat</span></h1>
  <p>Ask questions about your indexed PDFs — every answer cites its source.</p>
</header>
<div id="chat"></div>
<div class="hint" id="hint">Try: “What is the warranty period for the Nimbus Home Hub?”</div>
<div id="bar">
  <input id="q" placeholder="Ask a question about your documents…" autocomplete="off">
  <button id="ask">Ask</button>
</div>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const btn = document.getElementById('ask');
const hint = document.getElementById('hint');

function bubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  hint.style.display = 'none';
  bubble(esc(question), 'user');
  q.value = '';
  btn.disabled = true;
  const bot = bubble('Thinking…', 'bot');
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({question})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'request failed');
    let html = esc(data.answer);
    if (data.sources && data.sources.length) {
      html += '<div class="src"><b>Sources</b><br>' + data.sources.map(s =>
        `[${s.n}] ${esc(s.title)} — page ${s.page} (relevance ${s.score})`
      ).join('<br>') + '</div>';
    }
    bot.innerHTML = html;
  } catch (e) {
    bot.textContent = 'Error: ' + e.message + ' (is the index built? POST /ingest first)';
  }
  btn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}
btn.onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
